<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Dark Luxury Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1F1D18" />
      <stop offset="50%" stop-color="#141310" />
      <stop offset="100%" stop-color="#0B0B09" />
    </linearGradient>

    <!-- Premium Metallic Gold Gradient -->
    <linearGradient id="goldPrimary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7E7BD" />
      <stop offset="25%" stop-color="#D4AF37" />
      <stop offset="65%" stop-color="#AA7C11" />
      <stop offset="90%" stop-color="#E8C86B" />
      <stop offset="100%" stop-color="#F9EBC8" />
    </linearGradient>

    <!-- Secondary Bright Gold Highlight -->
    <linearGradient id="goldHighlight" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C5A059" />
      <stop offset="50%" stop-color="#FDF0CD" />
      <stop offset="100%" stop-color="#D4AF37" />
    </linearGradient>

    <!-- Soft Radial Glow for Lumière -->
    <radialGradient id="sunGlow" cx="50%" cy="32%" r="45%">
      <stop offset="0%" stop-color="#F7E7BD" stop-opacity="0.45" />
      <stop offset="50%" stop-color="#D4AF37" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#D4AF37" stop-opacity="0" />
    </radialGradient>
    
    <filter id="dropGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Rounded Shield Tile -->
  <rect x="16" y="16" width="480" height="480" rx="120" fill="url(#bgGrad)" stroke="url(#goldPrimary)" stroke-width="6" />
  
  <!-- Inset Delicate Gold Border -->
  <rect x="28" y="28" width="456" height="456" rx="108" fill="none" stroke="url(#goldHighlight)" stroke-width="2" stroke-opacity="0.4" />

  <!-- Ambient Light Glow Behind Monogram -->
  <circle cx="256" cy="210" r="150" fill="url(#sunGlow)" />

  <!-- Radiant Light Rays (Lumière Symbol) -->
  <g fill="url(#goldHighlight)" opacity="0.95">
    <!-- Top Vertical Ray -->
    <path d="M256 62 L263 102 L256 110 L249 102 Z" />
    <!-- Top-Right Diagonal Ray -->
    <path d="M312 84 L306 120 L297 115 L320 74 Z" />
    <!-- Top-Left Diagonal Ray -->
    <path d="M200 84 L192 74 L215 115 L206 120 Z" />
    <!-- Right Horizontal Ray -->
    <path d="M356 130 L322 142 L320 132 L362 118 Z" />
    <!-- Left Horizontal Ray -->
    <path d="M156 130 L150 118 L192 132 L190 142 Z" />
  </g>

  <!-- Central Star Emblem -->
  <path d="M256 94 L265 125 L296 134 L265 143 L256 174 L247 143 L216 134 L247 125 Z" fill="url(#goldPrimary)" filter="url(#dropGlow)" />

  <!-- Grand Hotel Archway Silhouette -->
  <path d="M148 400 L148 260 Q148 180 256 180 Q364 180 364 260 L364 400 L340 400 L340 260 Q340 204 256 204 Q172 204 172 260 L172 400 Z" fill="url(#goldPrimary)" />

  <!-- Elegant Serif Monogram 'M' -->
  <g fill="url(#goldHighlight)">
    <!-- Left Pillar -->
    <path d="M192 380 L192 254 L214 254 L214 380 Z" />
    <!-- Left Diagonal -->
    <path d="M208 254 L256 342 L244 342 L196 254 Z" />
    <!-- Right Diagonal -->
    <path d="M304 254 L316 254 L268 342 L256 342 Z" />
    <!-- Right Pillar -->
    <path d="M298 380 L298 254 L320 254 L320 380 Z" />
    <!-- Serif Feet and Tops -->
    <path d="M184 254 L222 254 L222 260 L184 260 Z" />
    <path d="M290 254 L328 254 L328 260 L290 260 Z" />
    <path d="M184 374 L222 374 L222 380 L184 380 Z" />
    <path d="M290 374 L328 374 L328 380 L290 380 Z" />
  </g>

  <!-- Luxury Pedestal Base -->
  <path d="M130 416 L382 416 L382 426 Q382 430 378 430 L134 430 Q130 430 130 426 Z" fill="url(#goldPrimary)" />

  <!-- 3 Stars Hospitality Rating Motif -->
  <g fill="url(#goldPrimary)">
    <!-- Left Star -->
    <path d="M196 445 L199 453 L208 453 L201 458 L203 466 L196 461 L189 466 L191 458 L184 453 L193 453 Z" />
    <!-- Center Star (Slightly Larger) -->
    <path d="M256 442 L260 452 L271 452 L262 458 L266 468 L256 462 L246 468 L250 458 L241 452 L252 452 Z" fill="url(#goldHighlight)" />
    <!-- Right Star -->
    <path d="M316 445 L319 453 L328 453 L321 458 L323 466 L316 461 L309 466 L311 458 L304 453 L313 453 Z" />
  </g>
</svg>